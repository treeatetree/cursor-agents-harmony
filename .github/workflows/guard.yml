name: guard

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash ./scripts/check-secrets.sh
      # HAP / Hypium stay local (./scripts/build.sh, ./scripts/test.sh) — ubuntu has no HarmonyOS SDK.
      - name: Acceptance checklist still says dual column
        run: |
          if grep -q '外屏竖屏：单栏' ACCEPTANCE_CHECKLIST.txt; then
            echo "ACCEPTANCE_CHECKLIST still requires outdated single-column cover"
            exit 1
          fi
